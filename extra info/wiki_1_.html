<h2 id="distribution">Distribution Methods</h2>
<p><strong>automatic</strong>: The system distributes enrolled students into groups within the configured size range. For community groups, this is done once at the start of the cohort. For raids, it is done when the raid becomes active. Students marked <code>away</code> in their Record are excluded from automatic distribution.</p>
<p><strong>manual</strong>: A mentor explicitly arranges the groups. Useful when specific pairings are needed (e.g., balancing skill levels or accommodating campus constraints).</p>
<p><strong>student_formed</strong>: Students create groups and invite each other, subject to the size limit. Mentors retain the ability to add/remove members.</p>

<h2 id="mentor-management">Mentor Management</h2>
<p>Regardless of how a group was formed, mentors can always add or remove members from a group using the <code>GroupMember</code> entity. Removals record <code>removed_at</code>, <code>removed_by</code>, and <code>removal_reason</code>. Mentors can also shuffle group composition after automatic distribution — e.g., if a student's attendance changes or a group is unbalanced. If a student is removed from a Raid group after the group has been formed but before the Raid completes, they lose access to the group's Gitea repository collaborator role.</p>

<h2 id="xp-risk">XP Risk & Inactive Members</h2>
<p>When a Raid group passes, every active <code>GroupMember</code> (where <code>is_active = true</code> and <code>removed_at</code> is null) automatically receives the <code>Raid.xp_reward</code> via an <code>XPTransaction</code>. This means an inactive student who has not been removed from the group would receive points they did not earn. Mentors are expected to proactively remove non-participating students from groups, which is why the <code>GroupMember.removal_reason</code> field exists — to provide a documented rationale for the removal.</p>

<h2 id="lifecycle">Group Lifecycle</h2>
<p>A group's <code>status</code> moves from <code>active</code> → <code>completed</code> (Raid passed) or <code>disbanded</code> (dissolved administratively or at the end of a community group's lifespan). When a community group reaches its <code>dissolved_at</code> datetime, members lose access to the group chat. Historical messages are retained for the platform's records but are no longer accessible to students.</p>

<h2 id="record-types">Record Types & Consequences</h2>
<p>A <strong>Record</strong> is created by a mentor or admin on a student's profile. The <code>type</code> field describes what the record is; the <code>consequence</code> field describes what happens as a result. These can differ — a record of <code>type: observation</code> always has <code>consequence: none</code>, but a <code>type: restriction</code> record can have varying effect durations depending on its configuration.</p>

<table class="wiki-table">
  <tr><th>Type</th><th>Reversible</th><th>Common use</th></tr>
  <tr><td>observation</td><td>N/A</td><td>Mentor notes: attendance concerns, positive feedback, context for later records</td></tr>
  <tr><td>notice</td><td>Yes (auto or manual)</td><td>Temporary warning banner on student's dashboard</td></tr>
  <tr><td>away</td><td>Yes (manual)</td><td>Student is temporarily unavailable; excluded from group distribution but keeps access</td></tr>
  <tr><td>restriction</td><td>Yes (auto or manual)</td><td>Temporary access limitation — e.g., 2 weeks, 30 minutes</td></tr>
  <tr><td>block</td><td>Yes (manual)</td><td>Long-period access limitation for serious or repeated violations</td></tr>
  <tr><td>expulsion</td><td>No</td><td>Permanent platform removal; student loses all access immediately</td></tr>
</table>

<h2 id="effects">RecordEffect Separation</h2>
<p>A <strong>RecordEffect</strong> row describes one concrete system action triggered by a Record. A single Record can spawn multiple RecordEffect rows — for example, a <code>restrict</code> record might produce both a <code>revoke_platform_access</code> effect and a <code>dashboard_banner</code> effect. This separation means:</p>
<ul>
  <li>Effects can be individually toggled without changing the Record</li>
  <li>Different programs can configure different effects for the same record type</li>
  <li>The system can end individual effects (e.g., restore access while keeping the banner) without ending the Record itself</li>
</ul>
<p>Available effect types: <code>revoke_platform_access</code>, <code>exclude_from_distribution</code>, <code>revoke_audit_access</code>, <code>dashboard_banner</code>, <code>restrict_submissions</code>.</p>

<h2 id="timing">Timing: Immediate vs. Scheduled</h2>
<p>When creating a Record, the admin configures whether it takes effect immediately (<code>effective_immediately = true</code>) or at a scheduled <code>effective_at</code> datetime. They also choose whether it ends automatically (<code>end_type: automatic</code>, with <code>auto_end_at</code> set) or must be manually ended (<code>end_type: manual</code>). A restriction might be set for exactly 2 weeks with automatic expiry, or it might be left open-ended for the mentor to resolve after meeting with the student.</p>

<h2 id="ending">Ending a Record</h2>
<p>Active Records (except expulsions, which are permanent) can be ended by an admin. When a Record is ended, the platform sets <code>ended_at</code> and <code>ended_by</code> on the Record, and marks all associated RecordEffect rows as <code>is_active = false</code>. The student's access is restored and any dashboard notice is removed. The Record itself remains in the database permanently as a documented history of the event.</p>

<h2 id="dashboard-notice">Dashboard Notices</h2>
<p>The <code>dashboard_notice</code> field on a Record contains text that is displayed directly on the student's dashboard while the Record is active. This is distinct from system-generated notifications — it is a persistent, visible notice that the student sees every time they log in. It is used for warnings, temporary notices, or context that the student needs to see immediately.</p>

<h2 id="away-status">The Away Status</h2>
<p>The <code>away</code> record type is a soft status for students who are temporarily unavailable (illness, family emergency, etc.). It is the only status that explicitly preserves platform access while modifying group behaviour. Students marked <code>away</code> retain full learning access but the system's group distribution algorithm excludes them — they will not be automatically assigned to Raid teams or audit pairs while the away record is active.</p>
`,

<h2 id="code-quest-audit">Code Quest Auditing</h2>
<p>Code quests use a four-tier pipeline. All submissions pass through T1 automatically; escalation to higher tiers is triggered by flags or configuration.</p>
<ul>
  <li><strong>T1 — Automated Test Cases (100% of submissions):</strong> All code quests carry a <code>test_cases</code> JSON. Submission triggers an automated runner against defined input/output pairs. Pass/fail is determined by the test coverage threshold (default: 100% pass rate on public tests; hidden tests vary per quest).</li>
  <li><strong>T2 — AI-Assisted Code Review (all passing submissions):</strong> An LLM reviews passing code for style alignment, potential plagiarism indicators (unusual similarity to other submissions), hardcoded test outputs, and inappropriate shortcuts. Suspicious submissions are flagged for T3. Result stored in <code>Audit.ai_review_result</code>.</li>
  <li><strong>T3 — Peer Audit (for <code>allows_peer_audit = true</code> quests):</strong> An anonymous assigned reviewer checks whether the code actually solves the problem and is the student's own work, using the <code>AuditQuestion</code> checklist. The reviewer has 48 hours. Disputes go to T4.</li>
  <li><strong>T4 — Instructor Review (flagged only, &lt;5% of submissions):</strong> Manual review by an instructor. May trigger a live verbal explanation session via <code>Audit.conference_link</code>. Outcome: pass / fail / retry.</li>
</ul>

<h2 id="notebook-quest-audit">Notebook Quest Auditing</h2>
<p>Notebook quests (Jupyter <code>.ipynb</code> files committed to Gitea) use a three-tier pipeline.</p>
<ul>
  <li><strong>T1 — Structure Validation (automated):</strong> Check that the notebook is committed to Gitea, all required cells exist, outputs are present (not cleared), and the file naming convention matches <code>repository_naming_convention</code>. Result in <code>Audit.notebook_structure_check</code>.</li>
  <li><strong>T2 — AI Output Review (automated + AI-assisted):</strong> Specific cell outputs (model accuracy, final metrics, visualizations) are extracted and checked against expected ranges. An LLM reviews narrative cells for coherence and correctness. Result in <code>Audit.notebook_ai_output_review</code>.</li>
  <li><strong>T3 — Instructor Spot-Check (15% random + all flagged):</strong> An instructor reviews the full notebook, checking that the analysis is genuine, conclusions are supported by the data, and there is no copy-paste of outputs without understanding.</li>
</ul>

<h2 id="mcq-audit">MCQ Quest Auditing</h2>
<p>MCQ quests use instant automated scoring with behavioral safeguards.</p>
<ul>
  <li><strong>T1 — Fully Automated Scoring:</strong> Instant scoring on submission. Results are locked on submit (no editing after). Score history is kept per attempt.</li>
  <li><strong>T2 — Behavioral Analytics:</strong> Time-per-question tracking. Submissions are flagged if all questions are answered in under 60 seconds total, if the answer pattern matches another student identically, or if session IP/device anomalies are detected. Flagged submissions proceed to T3. Result in <code>Audit.behavioral_analytics_result</code>.</li>
  <li><strong>T3 — Randomized Question Banks + Re-sit Protocol:</strong> Different students see different questions drawn from the same bank. If cheating is suspected, the student is required to re-take under proctored conditions (physical or screen-share). The re-sit outcome determines the official score.</li>
</ul>

<h2 id="essay-audit">Essay & Short Answer Auditing</h2>
<p>Essay and free-response quests use a four-tier pipeline combining AI scoring, peer review, and integrity checks.</p>
<ul>
  <li><strong>T1 — AI Rubric Scoring (all submissions):</strong> An LLM grades against a pre-defined rubric with criteria and weights. Returns a score and criterion-level breakdown — this is the <em>starting score</em>. Stored in <code>Audit.ai_rubric_score</code> and <code>Audit.ai_rubric_breakdown</code>.</li>
  <li><strong>T2 — Blind Peer Review (2 peers per essay):</strong> Two cohort members grade the same essay independently using the <code>AuditQuestion</code> checklist. Reviewers don't see each other's scores. Final score is a weighted average of AI score + peer 1 + peer 2 (configurable weights per quest). Scores stored in <code>Audit.peer_review_scores</code>. Outlier resolution (peers diverge by &gt;30%) goes to T3.</li>
  <li><strong>T3 — Instructor Adjudication (outliers + disputes):</strong> Triggered when peer scores diverge by &gt;30%, the student disputes the score, or the AI flagged the essay as potentially AI-generated. The instructor makes the final call.</li>
  <li><strong>T4 — AI-generated Content Detection:</strong> All essays are screened for LLM-generation patterns. High-probability AI-generated submissions require a live verbal follow-up (the student must explain their argument verbally). Confirmed AI-generated work results in a score of 0 plus a warning. Detection result in <code>Audit.ai_content_detection_result</code>.</li>
</ul>

<h2 id="checkpoint-audit">Checkpoint Auditing</h2>
<p>Checkpoints combine multiple question types and use a three-tier pipeline with an oral component on the final checkpoint.</p>
<ul>
  <li><strong>T1 — Automated Scoring (MCQ + code portions):</strong> MCQ sections are instantly scored. Code task sections are run through automated test runners. Results are available within 1 hour of submission close.</li>
  <li><strong>T2 — Instructor Review (essay + short answer portions):</strong> All essay and short-answer portions are reviewed by an instructor within 48 hours using rubric-based, documented scoring. Students have a 72-hour appeals window after results are released.</li>
  <li><strong>T3 — Oral Component (final checkpoint only):</strong> The final checkpoint includes a live oral exam scored by 2 instructors using the <code>AuditQuestion</code> checklist. The session is recorded and kept for 30 days. Passing requires ≥70% on the combined written and oral score. The conference call uses <code>Audit.conference_link</code>.</li>
</ul>

<h2 id="raid-audit">Raid Auditing</h2>
<p>Raids use a four-tier pipeline. The oral code explanation (T4) applies to all Standard and Extended Capstone raids.</p>
<ul>
  <li><strong>T1 — Automated Repo Tests (all raids with code):</strong> A test suite runs against the shared Gitea repo. Checks: all tests pass, the deployment URL returns 200 (for Deployment raids), required files are present, and commit history shows multiple contributors.</li>
  <li><strong>T2 — Contribution Analysis:</strong> Git commit history is analyzed per member. Groups are flagged if any one member accounts for &gt;80% of commits. Flagged groups proceed to T4. Result in <code>Audit.commit_contribution_analysis</code>.</li>
  <li><strong>T3 — Peer Contribution Rating (within group):</strong> Each group member rates all other members' contributions on a 1–5 scale with a short text explanation. Ratings are aggregated privately. Members rated 1 by all peers trigger an instructor review. Stored in <code>Audit.peer_contribution_ratings</code>.</li>
  <li><strong>T4 — Code Explanation Oral Audit (all Standard and Extended raids):</strong> All members join a video session via <code>Audit.conference_link</code>. Each member is asked to explain 2–3 random parts of the codebase — including parts they didn't write. Inability to explain any part results in a group fail. The session is recorded and the <code>AuditQuestion</code> checklist is used. Per-member outcomes stored in <code>Audit.code_explanation_results</code>.</li>
</ul>

<h2 id="integrity-policy">Integrity Policy</h2>
<p>Violations are tracked and escalated on a first/second offense basis:</p>
<table class="wiki-table">
  <tr><th>Violation</th><th>Detection</th><th>First offense</th><th>Second offense</th></tr>
  <tr><td>Hardcoded test outputs in code quest</td><td>AI code review (T2) + hidden test cases</td><td>Quest invalidated, 72hr cooldown, re-attempt required</td><td>Subject-level review + formal warning</td></tr>
  <tr><td>Code copying between students</td><td>Similarity detection (T2)</td><td>Both students: quest invalidated + oral explanation required</td><td>Program probation</td></tr>
  <tr><td>AI-generated essay submission</td><td>AI detection (T4) + verbal follow-up</td><td>Score = 0, must resubmit with verified work</td><td>Program suspension review</td></tr>
  <tr><td>Raid free-riding (contribution &lt;15%)</td><td>Git analysis (T2) + peer rating (T3)</td><td>Individual raid fail (group may still pass), quest re-assigned</td><td>Group disbanded, solo redo</td></tr>
  <tr><td>Inability to explain code in oral audit</td><td>Oral audit (T4)</td><td>Entire group fails the raid, must redo</td><td>Individual academic review</td></tr>
  <tr><td>Checkpoint cheating (copied answers)</td><td>Behavioral analytics (T2)</td><td>Proctored re-sit required (physical)</td><td>Formal academic misconduct process</td></tr>
</table>

<h2 id="verification-codes">Verification Codes</h2>
<p>Before any human audit can begin, both parties must enter a generated verification code into the platform. This confirms that the correct student is present and the correct auditor is conducting the review — preventing one student from submitting work written by someone else, or an audit being conducted without the student's knowledge. The code is generated by the platform and displayed to both parties once the audit session is opened.</p>

<h2 id="checklist">The Audit Checklist (AuditQuestion)</h2>
<p>Human audit stages are driven by <strong>AuditQuestion</strong> records attached to the quest, raid, or checkpoint being audited. Questions are categorized:</p>
<table class="wiki-table">
  <tr><th>Category</th><th>Affects pass/fail?</th><th>Examples</th></tr>
  <tr><td>requirement</td><td>Yes</td><td>Did the repo clone successfully? Is the project functional?</td></tr>
  <tr><td>functional</td><td>Yes</td><td>Does it handle multiple inputs correctly? Are there 500 errors?</td></tr>
  <tr><td>compliance</td><td>Yes</td><td>Is it written in the required language? Are only allowed packages used? Are answers computed rather than hardcoded?</td></tr>
  <tr><td>bonus</td><td>No</td><td>Is the code efficient? Does it follow best practices? What did the student learn?</td></tr>
  <tr><td>social</td><td>No</td><td>Did the student explain their approach clearly?</td></tr>
</table>
<p>Bonus and social questions are explicitly non-consequential — answering them well earns additional XP, but failing them does not cause the audit to fail. A student who passes all requirement/functional/compliance checks has passed the audit regardless of bonus answers.</p>

<h2 id="bonus-questions">Bonus Questions</h2>
<p>Bonus questions reward depth of understanding and good engineering practices without punishing students who simply met the requirements. The auditor records responses in <code>Audit.bonus_responses</code> (JSON). If the student's answers meet the bonus criteria, the platform awards additional XP via <code>Audit.xp_modifier</code> on top of the base quest XP.</p>

<h2 id="peer-auditing">Peer Auditing</h2>
<p>When a Quest has <code>allows_peer_audit = true</code>, the T3 auditor for code quests is a fellow student rather than a coding mentor. Peer auditors are paired by the system or assigned by a mentor. The same checklist and verification code system applies. For essay quests, peer review is a built-in T2 step (two blind peer reviewers per essay) rather than an optional flag. Raid T3 is a separate peer contribution rating rather than a code review exercise.</p>

<h2 id="reassignment">Reassignment</h2>
<p>A coding mentor can reassign any human-stage audit to themselves or to another mentor in the same campus. The <code>Audit.assigned_by</code> field tracks who made the assignment. Reassignment is useful when the original auditor is unavailable, has a conflict of interest, or when a second opinion is needed. The reassignment resets the audit to <code>assigned</code> status for the new auditor.</p>
`,
  related: ['quest','raid','groups','gamification','gitea','records']
},

// ──────────────────────────────────────────
// ROUTER & RENDERER
// ──────────────────────────────────────────

const ALL_PAGE_REFS = Object.keys(PAGES).map(id => ({
  id,
  title: PAGES[id].title,
  subtitle: PAGES[id].subtitle || ''
}));

function navigate(pageId) {
  window.location.hash = pageId;
}

function renderPage(pageId) {
  const page = PAGES[pageId] || PAGES['home'];

  // breadcrumb
  const bc = document.getElementById('breadcrumb');
  let breadHTML = '<a onclick="navigate(\'home\')" style="cursor:pointer">Main page</a>';
  if (page.breadcrumb && page.breadcrumb.length) {
    page.breadcrumb.forEach(crumb => {
      const crumbPage = PAGES[crumb];
      if (crumbPage) breadHTML += ` <span>›</span> <a onclick="navigate('${crumb}')" style="cursor:pointer">${crumbPage.title.split('—')[0].trim()}</a>`;
    });
  }
  if (pageId !== 'home') breadHTML += ` <span>›</span> <em>${page.title}</em>`;
  bc.innerHTML = breadHTML;

  document.getElementById('page-title').textContent = page.title;
  document.getElementById('page-subtitle').textContent = page.subtitle || '';
  document.getElementById('page-lead').innerHTML = page.lead || '';

  // update nav active state
  document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));

  // build body
  const body = document.getElementById('page-body');
  let html = '';

  // infobox
  if (page.infobox) {
    html += `<div class="infobox">
      <div class="infobox-title">${page.infobox.title}</div>`;
    if (page.infobox.subtitle) html += `<div class="infobox-subtitle">${page.infobox.subtitle}</div>`;
    html += `<table>`;
    page.infobox.rows.forEach(row => {
      html += `<tr><td>${row.label}</td><td>${row.value}</td></tr>`;
    });
    html += `</table></div>`;
  }

  // TOC
  if (page.toc && page.toc.length > 0) {
    html += `<div class="toc"><div class="toc-title">Contents</div><ol>`;
    page.toc.forEach((item, i) => {
      html += `<li><a href="#${item.id}">${item.title}</a></li>`;
    });
    html += `</ol></div>`;
  }

  html += page.body || '';

  // related pages
  if (page.related && page.related.length) {
    html += `<div class="related-box"><strong>See also</strong><div class="related-tags">`;
    page.related.forEach(relId => {
      const relPage = PAGES[relId];
      if (relPage) {
        html += `<a class="related-tag" onclick="navigate('${relId}')">${relPage.title.split('—')[0].trim()}</a>`;
      }
    });
    html += `</div></div>`;
  }

  body.innerHTML = html;

  // make all internal #hash links work through router
  body.querySelectorAll('a[href^="#"]').forEach(link => {
    const target = link.getAttribute('href').slice(1);
    if (PAGES[target]) {
      link.removeAttribute('href');
      link.style.cursor = 'pointer';
      link.onclick = () => navigate(target);
    }
  });

  window.scrollTo(0, 0);
  document.title = `${page.title} — TalentNation Platform Wiki`;
}

// ──────────────────────────────────────────
// SEARCH
// ──────────────────────────────────────────

const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchResults.style.display = 'none'; return; }

  const matches = ALL_PAGE_REFS.filter(p =>
    p.title.toLowerCase().includes(q) || p.subtitle.toLowerCase().includes(q)
  ).slice(0, 8);

  if (!matches.length) { searchResults.style.display = 'none'; return; }

  searchResults.innerHTML = matches.map(p =>
    `<div class="search-result-item" onclick="navigate('${p.id}'); searchInput.value=''; searchResults.style.display='none'">
      <strong>${p.title}</strong>
      <span>${p.subtitle}</span>
    </div>`
  ).join('');
  searchResults.style.display = 'block';
});

document.getElementById('search-btn').onclick = () => {
  const q = searchInput.value.trim().toLowerCase();
  const match = ALL_PAGE_REFS.find(p => p.title.toLowerCase().includes(q));
  if (match) { navigate(match.id); searchInput.value = ''; searchResults.style.display = 'none'; }
};

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('search-btn').click();
  if (e.key === 'Escape') { searchResults.style.display = 'none'; }
});

document.addEventListener('click', e => {
  if (!e.target.closest('#site-search')) searchResults.style.display = 'none';
});

// ──────────────────────────────────────────
// INIT
// ──────────────────────────────────────────

window.addEventListener('hashchange', () => {
  const pageId = window.location.hash.slice(1) || 'home';
  renderPage(pageId);
});

renderPage(window.location.hash.slice(1) || 'home');
</script>
</body>
</html>
