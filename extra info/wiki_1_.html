<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentNation SIWES Platform — Project Wiki</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f7f2;
    --surface: #ffffff;
    --border: #c8c0b0;
    --border-light: #e8e0d0;
    --text: #1c1b18;
    --text-muted: #54514a;
    --link: #2a52be;
    --link-visited: #5b3e8f;
    --link-hover: #1a3a9e;
    --accent: #2a52be;
    --infobox-header: #2a52be;
    --infobox-bg: #f0f4fc;
    --toc-bg: #f8f7f2;
    --note-bg: #fff8e8;
    --note-border: #e0c060;
    --tag-bg: #eef2fb;
    --tag-text: #2a52be;
    --header-bg: #2a3050;
    --header-text: #ffffff;
    --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --display: 'Playfair Display', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.75;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  #site-header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 3px solid #1a3060;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  #site-logo {
    font-family: var(--display);
    font-size: 17px;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  #site-logo span { color: #99b4f0; font-style: italic; }

  #site-search {
    flex: 1;
    max-width: 420px;
    display: flex;
    gap: 0;
  }
  #search-input {
    flex: 1;
    padding: 6px 12px;
    border: 1px solid #556;
    border-right: none;
    background: #1e2540;
    color: #fff;
    font-family: var(--sans);
    font-size: 13px;
    border-radius: 3px 0 0 3px;
    outline: none;
  }
  #search-input::placeholder { color: #8899cc; }
  #search-input:focus { border-color: #88aaff; background: #232b4a; }
  #search-btn {
    padding: 6px 14px;
    background: #3a5dc8;
    color: #fff;
    border: 1px solid #3a5dc8;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 13px;
    border-radius: 0 3px 3px 0;
  }
  #search-btn:hover { background: #2a4db8; }

  #nav-links {
    display: flex;
    gap: 4px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .nav-link {
    color: #aac0ee;
    font-family: var(--sans);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 3px;
    transition: background 0.15s, color 0.15s;
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.12); color: #fff; }

  /* ── SEARCH RESULTS DROPDOWN ── */
  #search-results {
    position: absolute;
    top: 52px;
    left: 50%;
    transform: translateX(-50%);
    width: 380px;
    background: #fff;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 4px 4px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    display: none;
    z-index: 200;
  }
  .search-result-item {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--border-light);
    font-family: var(--sans);
    font-size: 13px;
  }
  .search-result-item:hover { background: var(--infobox-bg); }
  .search-result-item strong { color: var(--text); display: block; font-size: 14px; }
  .search-result-item span { color: var(--text-muted); font-size: 12px; }

  /* ── LAYOUT ── */
  #app {
    max-width: 1060px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  /* ── PAGE TITLE ── */
  #page-title {
    font-family: var(--display);
    font-size: 32px;
    font-weight: 400;
    line-height: 1.2;
    color: var(--text);
    border-bottom: 2px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 6px;
  }
  #page-subtitle {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
    font-style: italic;
  }

  /* ── LEAD ── */
  #page-lead {
    font-size: 15.5px;
    line-height: 1.8;
    margin-bottom: 20px;
    color: var(--text);
  }

  /* ── INFOBOX ── */
  .infobox {
    float: right;
    clear: right;
    margin: 0 0 20px 28px;
    width: 290px;
    background: var(--infobox-bg);
    border: 1px solid var(--border);
    font-family: var(--sans);
    font-size: 13px;
    border-radius: 2px;
  }
  .infobox-title {
    background: var(--infobox-header);
    color: #fff;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.03em;
  }
  .infobox-subtitle {
    text-align: center;
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
  }
  .infobox table { width: 100%; border-collapse: collapse; }
  .infobox tr { border-bottom: 1px solid var(--border-light); }
  .infobox tr:last-child { border-bottom: none; }
  .infobox td { padding: 5px 10px; vertical-align: top; line-height: 1.4; }
  .infobox td:first-child {
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
    width: 40%;
    font-size: 12px;
  }
  .infobox td:last-child { color: var(--text); font-size: 12.5px; }
  .infobox-field-group {
    background: #e4ecfa;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--infobox-header);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ── TOC ── */
  .toc {
    float: left;
    clear: left;
    margin: 0 24px 20px 0;
    background: var(--toc-bg);
    border: 1px solid var(--border);
    padding: 12px 16px;
    min-width: 190px;
    max-width: 230px;
    font-family: var(--sans);
    font-size: 13px;
    border-radius: 2px;
  }
  .toc-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 8px;
    color: var(--text);
    border-bottom: 1px solid var(--border-light);
    padding-bottom: 6px;
  }
  .toc ol { padding-left: 18px; }
  .toc li { margin: 3px 0; line-height: 1.4; }
  .toc a { color: var(--link); text-decoration: none; font-size: 12.5px; }
  .toc a:hover { text-decoration: underline; }
  .toc .toc-sub { padding-left: 14px; }

  /* ── CONTENT ── */
  #page-body { overflow: hidden; }
  #page-body::after { content: ''; display: table; clear: both; }

  h2 {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 400;
    border-bottom: 1px solid var(--border);
    margin: 28px 0 12px;
    padding-bottom: 4px;
    color: var(--text);
    clear: both;
  }
  h3 {
    font-family: var(--display);
    font-size: 17px;
    font-weight: 700;
    margin: 20px 0 8px;
    color: var(--text);
  }
  h4 {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    margin: 16px 0 6px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  p { margin: 0 0 12px; }
  ul, ol { margin: 8px 0 12px 22px; }
  li { margin: 3px 0; }

  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; color: var(--link-hover); }
  a:visited { color: var(--link-visited); }

  /* ── ENTITY SCHEMA BOX ── */
  .schema-box {
    background: #f4f7fe;
    border: 1px solid #c8d8f0;
    border-radius: 3px;
    padding: 14px 18px;
    margin: 14px 0;
    font-family: var(--sans);
    font-size: 13px;
  }
  .schema-box h4 {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--infobox-header);
    margin: 0 0 10px;
    border-bottom: 1px solid #c8d8f0;
    padding-bottom: 6px;
  }
  .schema-field {
    display: grid;
    grid-template-columns: 200px 90px 1fr;
    gap: 0 12px;
    padding: 4px 0;
    border-bottom: 1px solid #e4ecfc;
    align-items: start;
  }
  .schema-field:last-child { border-bottom: none; }
  .field-name { font-family: 'Courier New', monospace; font-size: 12px; color: #1a3a7a; font-weight: bold; }
  .field-type { font-family: 'Courier New', monospace; font-size: 11px; color: #6a4a9a; }
  .field-desc { color: var(--text-muted); font-size: 12px; line-height: 1.4; }

  /* ── NOTE / CALLOUT ── */
  .note {
    background: var(--note-bg);
    border-left: 4px solid var(--note-border);
    padding: 10px 14px;
    margin: 14px 0;
    font-size: 14px;
    border-radius: 0 3px 3px 0;
  }
  .note strong { color: #8a6a00; }

  /* ── FLOW DIAGRAM (CSS) ── */
  .flow {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: wrap;
    margin: 16px 0;
    font-family: var(--sans);
    font-size: 12.5px;
  }
  .flow-step {
    background: var(--infobox-bg);
    border: 1px solid #b8c8e8;
    border-radius: 4px;
    padding: 7px 12px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s;
    min-width: 90px;
  }
  .flow-step:hover { background: #d8e8f8; }
  .flow-step a { color: var(--text); font-weight: 500; }
  .flow-arrow { color: var(--text-muted); padding: 0 6px; font-size: 16px; }

  /* ── RELATED PAGES ── */
  .related-box {
    border-top: 1px solid var(--border);
    margin-top: 32px;
    padding-top: 16px;
    font-family: var(--sans);
    font-size: 13px;
    clear: both;
  }
  .related-box strong { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .related-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .related-tag {
    background: var(--tag-bg);
    color: var(--tag-text);
    border: 1px solid #c0d0ee;
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
    text-decoration: none;
  }
  .related-tag:hover { background: #dce8fc; }

  /* ── BREADCRUMB ── */
  #breadcrumb {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  #breadcrumb a { color: var(--link); }
  #breadcrumb span { margin: 0 5px; }

  /* ── HIERARCHY TREE ── */
  .tree { font-family: var(--sans); font-size: 13px; margin: 12px 0; }
  .tree-node { display: flex; align-items: baseline; gap: 8px; margin: 5px 0; }
  .tree-node .connector { color: #aaa; }
  .tree-badge {
    background: #e0e8f8;
    border: 1px solid #b0c4e8;
    border-radius: 3px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--infobox-header);
    white-space: nowrap;
  }
  .tree-desc { color: var(--text-muted); font-size: 12px; }

  /* ── TABLE ── */
  .wiki-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--sans);
    font-size: 13px;
    margin: 14px 0;
  }
  .wiki-table th {
    background: #e8eef8;
    border: 1px solid var(--border);
    padding: 7px 10px;
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .wiki-table td {
    border: 1px solid var(--border-light);
    padding: 6px 10px;
    vertical-align: top;
    line-height: 1.5;
  }
  .wiki-table tr:nth-child(even) td { background: #fafaf7; }

  code {
    font-family: 'Courier New', monospace;
    font-size: 12.5px;
    background: #eef0f8;
    border: 1px solid #d8dce8;
    padding: 1px 5px;
    border-radius: 2px;
    color: #2a3a7a;
  }

  /* ── PRINT/MOBILE ── */
  @media (max-width: 720px) {
    .infobox { float: none; width: 100%; margin: 0 0 20px; }
    .toc { float: none; max-width: 100%; margin: 0 0 20px; }
    #nav-links { display: none; }
    .schema-field { grid-template-columns: 1fr; }
    .flow { gap: 4px; }
  }
</style>
</head>

<header id="site-header">
  <div id="site-logo" onclick="navigate('home')">TalentNation <span>Platform Wiki</span></div>
  <div id="site-search" style="position:relative">
    <input id="search-input" type="text" placeholder="Search pages and entities…" autocomplete="off">

</div>

<script>
// ──────────────────────────────────────────────
// PAGE DEFINITIONS
// ──────────────────────────────────────────────

const PAGES = {

// ═══════════════════════════════════════════
'home': {
  title: 'TalentNation SIWES Learning Platform',
  subtitle: 'A 6-month, predominantly online technical training program for Nigerian engineering students',
  breadcrumb: [],
  infobox: {
    title: 'Project At a Glance',
    subtitle: 'TalentNation SIWES Platform',
    rows: [
      { label: 'Type', value: 'Learning Management Platform' },
      { label: 'Target users', value: 'Nigerian SIWES engineering students' },
      { label: 'Program length', value: '6 months per cohort' },
      { label: 'Mode', value: 'Primarily online; physical sign-offs required' },
      { label: 'Git backend', value: '<a href="#gitea">Gitea</a> (self-hosted)' },
      { label: 'Content rendering', value: 'Rich HTML (TinyMCE on admin side)' },
      { label: 'Selection method', value: '<a href="#selection-game">Gamified aptitude assessment</a>' },
      { label: 'Curriculum style', value: '<a href="#gamification">XP-based, gamified, sequential</a>' },
      { label: 'Assessment types', value: '<a href="#quest">Quests</a>, <a href="#checkpoint">Checkpoints</a>, <a href="#raid">Raids</a>' },
      { label: 'Engagement layer', value: '<a href="#gamification">Achievements, streaks, XP & ranks</a>' },
      { label: 'Data entities', value: '58 across 15 domains' },
    ]
  },
  lead: `The TalentNation SIWES Learning Platform is a bespoke, configurable online training system designed to manage the full lifecycle of Nigerian <a href="#siwes">SIWES (Students Industrial Work Experience Scheme)</a> participants — from initial application through a gamified selection process, institutional verification, structured online learning, and ultimately graduation. Every major aspect of the platform, from progression rules and notification copy to group sizes and evaluation criteria, is <a href="#configuration">configurable</a> at multiple levels without code changes.`,
  toc: [
    { id: 'overview', title: 'Overview' },
    { id: 'user-lifecycle', title: 'The User Lifecycle' },
    { id: 'platform-domains', title: 'Platform Domains' },
    { id: 'key-design-decisions', title: 'Key Design Decisions' },
    { id: 'entity-count', title: 'Entity Summary' },
  ],
  body: `
<h2 id="overview">Overview</h2>
<p>The platform was designed to serve as the primary digital infrastructure for a company that trains Nigerian engineering students during their mandatory SIWES industrial attachment period and then places them with partner companies. Prior to this platform, the company operated using <strong>01Edu's</strong> existing curriculum and infrastructure. The new platform replicates and extends 01Edu's core ideas — including peer auditing, Git-integrated code submission, XP-based gamification, and granular admin controls — while being purpose-built for the Nigerian SIWES context, adding institutional verification workflows, physical document handling, and a complete application pipeline.</p>

<p>The program is structured around a <a href="#curriculum">hierarchical curriculum</a> (Subject → Course → Topic → Module) with three distinct assessment mechanics: individual <a href="#quest">Quests</a>, gatekeeper <a href="#checkpoint">Checkpoints</a>, and collaborative <a href="#raid">Raids</a>. All code submissions flow through a self-hosted <a href="#gitea">Gitea</a> instance. Students build XP through a tracked ledger, compete on leaderboards, and interact with peers through a built-in <a href="#community">community layer</a>.</p>

<h2 id="user-lifecycle">The User Lifecycle</h2>
<p>A student's journey through the platform is divided into two major acts: the <strong>application pipeline</strong> and <strong>active learning</strong>. These are separated by an institutional verification step that is specific to the SIWES context.</p>

<div class="flow">
  <div class="flow-step"><a onclick="navigate('application-pipeline')">Registration</a></div><div class="flow-arrow">→</div>
  <div class="flow-step"><a onclick="navigate('selection-game')">Selection Game</a></div><div class="flow-arrow">→</div>
  <div class="flow-step"><a onclick="navigate('verification')">Verification</a></div><div class="flow-arrow">→</div>
  <div class="flow-step"><a onclick="navigate('onboarding')">Onboarding</a></div><div class="flow-arrow">→</div>
  <div class="flow-step"><a onclick="navigate('curriculum')">Learning</a></div><div class="flow-arrow">→</div>
  <div class="flow-step">Graduation</div>
</div>

<h3>Stage 1 — Registration</h3>
<p>A prospective student registers on the platform and an <a href="#application-pipeline"><code>Application</code></a> record is created, along with a personal dashboard. The student selects a physical <a href="#campus">campus</a> at registration (because SIWES requires physical document interactions regardless of the program's online nature) and uploads their <strong>basic identity documents</strong> — school ID card, NIN scan, and profile picture — captured as <code>RegistrationDocument</code> records. Heavyweight SIWES paperwork (CYS form, logbook) is <em>not</em> collected at this stage; that comes only after the student has passed the game and been verified. The dashboard shows the application payment status and a countdown to the selection game.</p>

<h3>Stage 2 — Selection Game</h3>
<p>At a scheduled time, the student accesses the <a href="#selection-game">Selection Game</a> directly from their dashboard — no separate link is sent. The game is a timed, gamified aptitude assessment. Once the game window closes, the platform produces a <strong>scoreboard</strong> of every applicant and their score, filterable by passing the configured <code>game_cutoff_score</code>. Admin attention then narrows to that filtered list. Students below the cutoff are eventually rejected when the <a href="#application-pipeline"><code>ApplicationCohort</code></a> is closed.</p>

<h3>Stage 3 — Institutional Verification</h3>
<p>Verification only runs for the applicants who passed the game — sparing the rest of the pool from a costly manual process. The admin team sends bulk verification emails to schools using each passing student's matric number and name; the school responds to confirm or deny enrollment. This is modelled as a <a href="#verification"><code>VerificationRequest</code></a> entity, with follow-up tracking. Rejected students receive a rejection email; the exact reason is withheld to avoid disputes.</p>

<h3>Stage 4 — Onboarding</h3>
<p>After verification passes, the candidate is invited to a <strong>physical (or online) onboarding session</strong> at their selected campus. There they submit and have signed/stamped the official SIWES documents — the CYS (Company Year Schedule) form, the logbook, and any school-specific items — captured as <code>OnboardingDocument</code> records. Some documents can be electronically signed and stamped; others (particularly the logbook) require physical signatures from campus supervisors. Campus selection earlier in the flow determines which supervisor handles the physical elements.</p>

<h3>Stage 5 — Active Learning</h3>
<p>Once onboarding is complete, the student's dashboard transforms from a status page into the full <a href="#curriculum">learning interface</a>. The home tab shows the next actionable module as a card. Students progress through a curriculum of Subjects, Courses, Topics, and Modules, completing <a href="#quest">Quests</a> for XP, passing <a href="#checkpoint">Checkpoints</a> to unlock the next phase, and collaborating on <a href="#raid">Raids</a> with assigned groups. A <a href="#community">community layer</a> provides group chat, direct messages, and a social graph.</p>

<h3>Cohort Closing</h3>
<p>When an intake cycle ends, an admin triggers a "close cohort" action (styled as a red confirmation button to prevent accidental use). All remaining unaccepted applicants are rejected, rejection emails are dispatched, and — per the default configuration — rejected applicants' accounts and data are purged from the database. Accepted students continue into an active <a href="#application-pipeline"><code>Cohort</code></a> record that is separate from the application cohort.</p>

<h2 id="platform-domains">Platform Domains</h2>
<table class="wiki-table">
  <tr><th>Domain</th><th>Key Entities</th><th>Purpose</th></tr>
  <tr><td><a onclick="navigate('application-pipeline')">Application Pipeline</a></td><td>ApplicationCohort, Application, SelectionGame, GameAttempt, VerificationRequest, OnboardingDocument</td><td>Full pre-enrolment lifecycle</td></tr>
  <tr><td><a onclick="navigate('curriculum')">Curriculum</a></td><td>Program, Subject, Course, Topic, Module, Quest, QuestTask, Checkpoint, Raid, CurriculumDependency</td><td>All learning content and assessment</td></tr>
  <tr><td>Enrollment & Progression</td><td>Cohort, Enrollment, ProgressionStage, Event, StudentProgressSnapshot</td><td>Cohort management and progress tracking</td></tr>
  <tr><td><a onclick="navigate('audit-system')">Submissions & Auditing</a></td><td>Submission, Audit, AuditQuestion</td><td>Code submission, peer and mentor review (with raid conference calls)</td></tr>
  <tr><td><a onclick="navigate('groups')">Groups</a></td><td>Group, GroupMember</td><td>Raid teams, audit pairs, community groups</td></tr>
  <tr><td><a onclick="navigate('community')">Community</a></td><td>Post, DirectMessage, Friendship</td><td>Social layer: group chats, DMs, friends</td></tr>
  <tr><td><a onclick="navigate('records')">Records & Restrictions</a></td><td>Record, RecordEffect</td><td>Admin discipline and status management</td></tr>
  <tr><td><a onclick="navigate('gitea')">Git Integration</a></td><td>GiteaAccount, GiteaRepository, GiteaWebhook</td><td>Self-hosted Gitea as code backend</td></tr>
  <tr><td><a onclick="navigate('gamification')">XP & Scoring</a></td><td>XPTransaction, Leaderboard, Achievement, UserAchievement, Streak</td><td>Gamified progression, badges, streaks, and ranking</td></tr>
  <tr><td><a onclick="navigate('siwes')">SIWES Documentation</a></td><td>Logbook, LogbookEntry, WeeklyReport, OnboardingDocument</td><td>Physical SIWES compliance layer with AI-assisted weekly reports</td></tr>
  <tr><td>Platform Config</td><td>ConfigurationSetting, NotificationTemplate, AuditLog</td><td>Cascading configuration and admin audit trail</td></tr>
</table>

<h2 id="key-design-decisions">Key Design Decisions</h2>

<h3>Distinct curriculum entities instead of a polymorphic type</h3>
<p>Rather than having a single <code>CurriculumItem</code> with a type enum, the platform uses seven separate entities — Subject, Course, Topic, Module, Quest, Checkpoint, and Raid — each with its own fields, relationships, and extension points. This avoids nullable field sprawl and allows each entity to evolve independently as the curriculum design matures.</p>

<h3>Content as HTML</h3>
<p>Module content, quest learning materials, and task prompts are stored as rich HTML, produced by a backend TinyMCE editor. The frontend simply renders whatever HTML it receives, without needing specialized components for videos, code blocks, images, or other media types. This keeps frontend complexity minimal and gives content authors maximum flexibility.</p>

<h3>XP as an immutable ledger</h3>
<p>Rather than a mutable <code>xp_total</code> field on the enrollment record, every XP change is recorded as an <a href="#gamification"><code>XPTransaction</code></a> row. The current balance is derived. This provides a full audit trail and makes it trivial to explain where any student's points came from.</p>

<h3>Gitea as the Git backend</h3>
<p>The platform delegates all Git operations to a <a href="#gitea">self-hosted Gitea instance</a> rather than building its own Git infrastructure. The platform maintains thin mapping tables (<code>GiteaAccount</code>, <code>GiteaRepository</code>) to link platform concepts to Gitea entities, and listens to Gitea's push webhooks to trigger automated test runs.</p>

<h3>Cascading configuration</h3>
<p>All configurable behaviors — group sizes, XP cooldowns, notification content, submission rules — are stored in a <code>ConfigurationSetting</code> table with a scope hierarchy: Organization → Campus → Program → Cohort. Any level can override the one above it. This means a specific cohort can have different cooldown rules without touching the program defaults.</p>

<h3>Separation of Record and RecordEffect</h3>
<p>An admin <a href="#records">Record</a> (e.g., "block this student") documents the <em>decision and reason</em>. A <code>RecordEffect</code> row documents the <em>system action taken</em> (e.g., revoke platform access). The same record type can produce different effects in different programs, and effects can be toggled or extended without changing the record itself.</p>
`,
  related: ['application-pipeline','curriculum','gitea','siwes','gamification','community','audit-system','records','campus']
},

<h2 id="cohort-lifecycle">ApplicationCohort Lifecycle</h2>
<p>An <strong>ApplicationCohort</strong> represents one intake cycle — e.g., "October 2026 Intake." Admins open it at a defined date, applicants register during the window, and the cohort is eventually closed either at a scheduled <code>closes_at</code> datetime or manually by an admin. A cohort holds the <code>game_cutoff_score</code> (the minimum game score for automatic advancement), the <code>max_applicants</code> cap, and the <code>purge_rejected_data</code> flag that governs whether rejected applicants' accounts are deleted on close.</p>

<div class="schema-box">
  <h4>ApplicationCohort — Key Fields</h4>
  <div class="schema-field"><span class="field-name">status</span><span class="field-type">enum</span><span class="field-desc">open → in_review → closed</span></div>
  <div class="schema-field"><span class="field-name">game_cutoff_score</span><span class="field-type">integer</span><span class="field-desc">Minimum game score to advance to the review stage</span></div>
  <div class="schema-field"><span class="field-name">purge_rejected_data</span><span class="field-type">boolean</span><span class="field-desc">If true, delete rejected applicants' accounts on cohort close (default: true)</span></div>
  <div class="schema-field"><span class="field-name">closed_by</span><span class="field-type">user_id</span><span class="field-desc">Admin who triggered the cohort close action</span></div>
</div>

<h2 id="application-entity">The Application Entity</h2>
<p>Each applicant's journey is tracked in a single <strong>Application</strong> row, whose <code>status</code> field moves through the pipeline:</p>

<div class="flow">
  <div class="flow-step">registered</div><div class="flow-arrow">→</div>
  <div class="flow-step">game_pending</div><div class="flow-arrow">→</div>
  <div class="flow-step">game_completed</div><div class="flow-arrow">→</div>
  <div class="flow-step">review</div><div class="flow-arrow">→</div>
  <div class="flow-step">verification_pending</div><div class="flow-arrow">→</div>
  <div class="flow-step">verified</div><div class="flow-arrow">→</div>
  <div class="flow-step">onboarding</div><div class="flow-arrow">→</div>
  <div class="flow-step">accepted / rejected</div>
</div>

<p>The Application also carries <code>campus_id</code> (the physical <a href="#campus">campus</a> the student selected), <code>game_score</code>, <code>passed_game</code>, and <code>payment_status</code>. The <code>payment_status</code> is the only thing visible to the student on their dashboard before the game — specifically, it shows as "application payment."</p>

<h2 id="dashboard-from-day-one">Dashboard from Day One</h2>
<p>A dashboard is created automatically at the moment a student registers. Before the game, it shows a countdown and the payment status. After the game, it shows results. During verification and onboarding, it shows the relevant status/forms. Only after <code>accepted</code> status does the dashboard transition into the full learning interface. The <a href="#application-pipeline"><code>ProgressionStage.dashboard_state</code></a> enum drives this: <code>status_only</code> → <code>countdown</code> → <code>game_access</code> → <code>onboarding_form</code> → <code>full_learning</code>.</p>

<h2 id="game-stage">Game Stage</h2>
<p>The <a href="#selection-game"><strong>SelectionGame</strong></a> is a time-bound assessment accessed directly from the student's dashboard. No separate link is distributed. Each attempt is recorded as a <strong>GameAttempt</strong>, which stores the score, timing data, and whether the student passed the cutoff. See the <a href="#selection-game">Selection Game</a> page for full details.</p>

<h2 id="review-and-cutoff">Review & Cutoff — The Post-Game Scoreboard</h2>
<p>Once the game window closes, the platform produces an internal <strong>scoreboard</strong> of every applicant with their score, sortable and filterable by <code>game_score ≥ game_cutoff_score</code>. Applications meeting the cutoff are automatically advanced to <code>review</code> status. The admin team works only from the filtered "passed" view — verification is a high-touch manual process, and there is no point putting students who did not pass the game through it. Applicants below the cutoff sit in <code>game_completed</code> until cohort close, when they are rejected en masse.</p>

<div class="note"><strong>Note:</strong> From the student's perspective, the dashboard may still show "application payment" during the review stage, because the application is still pending from their side. The cutoff calculation is an internal admin-side event.</div>

<h2 id="institutional-verification">Institutional Verification</h2>
<p>Verification is initiated <strong>only</strong> for applicants on the post-game scoreboard who cleared the cutoff. See the dedicated <a href="#verification">Verification</a> page for full details. In brief: the admin team sends bulk emails to each passing student's institution (using <code>matric_number</code> and <code>institution_email</code> from the student's <strong>StudentProfile</strong>) and records the outcome in a <strong>VerificationRequest</strong> entity. The platform tracks follow-up emails sent, response status, and which admin processed the response.</p>

<h2 id="onboarding-stage">Onboarding Stage</h2>
<p>After verification passes, the student receives an email inviting them to a <strong>physical (or online) onboarding session</strong> at their selected campus. At that session, the candidate submits and has signed/stamped the official SIWES paperwork — the CYS form, the logbook, and any school-specific items — recorded as <code>OnboardingDocument</code> rows. (The basic identity documents collected back at registration live separately on <code>RegistrationDocument</code> rows; this stage is strictly for SIWES paperwork.) Some items can be processed entirely online; others require physical signatures. See the <a href="#onboarding">Onboarding</a> page for details.</p>

<h2 id="closing-a-cohort">Closing a Cohort</h2>
<p>When the intake cycle ends, an admin presses the close button (styled as a destructive red confirmation action to prevent accidental triggering). The platform then:</p>
<ol>
  <li>Sets <code>ApplicationCohort.status = 'closed'</code></li>
  <li>Marks all Applications not in <code>accepted</code> status as <code>rejected</code></li>
  <li>Dispatches rejection emails to all newly-rejected applicants</li>
  <li>If <code>purge_rejected_data = true</code>, deletes rejected applicants' User records, StudentProfiles, Applications, and related data</li>
  <li>Creates a <code>Cohort</code> entity for the accepted group to begin the learning program</li>
</ol>
<p>Re-registration is prevented by NIN uniqueness — a student whose NIN is in the system cannot re-register within the same cycle. After purge, a fresh application in the next cohort would be possible.</p>
`,

<h2 id="why-manual">Why Manual Verification</h2>
<p>Automated verification against Nigerian university databases is not currently feasible — there is no standard API or centralized registry. The platform therefore models the manual process faithfully: admin sends bulk emails to institutions, schools respond (sometimes requiring the student to physically remind school authorities to reply, as is common with scholarship processes), and the admin records the result. The system is designed so that verification can become more automated later without architectural changes — the <code>VerificationRequest</code> entity just acquires a new <code>verified_by_api</code> field.</p>

<h2 id="verification-flow">Verification Flow</h2>
<ol>
  <li>After a student passes the game, their Application enters <code>verification_pending</code> status</li>
  <li>The admin sends a bulk verification email to <code>StudentProfile.institution_email</code> with the student's name and matric number</li>
  <li>A <code>VerificationRequest</code> record is created with <code>status = pending</code></li>
  <li>If no response is received, the admin can send follow-ups; <code>follow_up_count</code> tracks these</li>
  <li>When the school responds, the admin updates <code>status</code> to <code>confirmed</code> or <code>denied</code></li>
  <li>A confirmed request advances the Application to <code>verified</code> → <code>onboarding</code> and triggers a notification to the student</li>

<p>The <strong>StudentProfile</strong> entity holds all SIWES-specific information about a student. It is separate from the base <code>User</code> entity because not all users are students (mentors, admins, and campus supervisors do not have student profiles), and because this data is collected only after game selection — the student submits it as part of the process that enables verification to begin.</p>

<div class="note"><strong>Two-stage document collection:</strong> Basic identity documents (school ID card, NIN scan, profile picture) are collected at <em>registration</em> and stored as <code>RegistrationDocument</code> rows — that's so admins can vet identity even before the game. Heavy SIWES paperwork lives here on <code>OnboardingDocument</code> and is collected only after the candidate has passed the game and been verified, at the in-person (or online) campus session described below.</div>

<h2 id="required-docs">Required Documents</h2>
<p>The primary SIWES documents are the <strong>CYS form</strong> (Company Year Schedule — the formal agreement between the student, institution, and placement company) and the <strong>logbook</strong>. Additional items such as an acceptance letter may also be required, and exact requirements can vary by institution. Each uploaded file is stored as an <code>OnboardingDocument</code> record with its own status and review workflow.</p>

<h2 id="digital-vs-physical">Digital vs. Physical Processing</h2>
<p>Where possible, documents are scanned, electronically signed, and electronically stamped. The platform supports this through the <code>OnboardingDocument</code> record's review/approval workflow. However, some documents — particularly the logbook — carry signature requirements that cannot be fully digitised under current SIWES regulations. These are flagged with <code>requires_physical_signature = true</code>, and their <code>physical_signature_status</code> tracks whether the campus supervisor has signed.</p>

<h2 id="completion">Completion & Transition</h2>
<p>Once all required OnboardingDocument records reach <code>approved</code> status (and any physical signatures are confirmed), the platform marks the Application as <code>accepted</code> and creates an <code>Enrollment</code> record in the learning <code>Cohort</code>. The student's dashboard then transitions from the onboarding form view (<code>dashboard_state: onboarding_form</code>) to the full learning interface (<code>dashboard_state: full_learning</code>). The student also receives a <a href="#gitea">Gitea</a> account at this point, provisioned automatically by the platform.</p>

  lead: `The curriculum is organized as a strict five-level hierarchy — Program, Subject, Course, Topic, Module — with three distinct assessment types hanging off this tree: Quests (individual challenges), Checkpoints (gatekeeper exams), and Raids (group projects). The platform runs four program variants: Track A (students with backend or fullstack experience) and Track B (students with no coding background), each available in 3-month and 6-month formats. Each level is a separate entity with its own fields, allowing it to evolve independently. A separate CurriculumDependency entity handles prerequisite relationships between any two nodes in the tree.`,

<h2 id="hierarchy">The Hierarchy</h2>
<div class="tree">

</div>

<p>Each entity in the hierarchy has an <code>order</code> integer for sequencing within its parent, an <code>is_required</code> boolean (required items are "starred"; optional items are for skill finessing), and an <code>is_sequential</code> boolean that gates access to the next item until the current one is complete.</p>

<h2 id="program-tracks">Program Tracks</h2>
<p>The platform runs four program variants, each represented as a distinct <code>Program</code> entity with a <code>track</code> and <code>duration_months</code> field:</p>
<table class="wiki-table">
  <tr><th>Track</th><th>Duration</th><th>Subjects</th><th>Quests (est.)</th><th>Checkpoints</th><th>Raids</th></tr>

</table>

<h2 id="content-delivery">Content Delivery</h2>
<p>The <strong>Module</strong> is the leaf node of the content tree — the actual thing a student reads or watches. Module content is stored as <code>content_html</code>: rich HTML authored in the admin's TinyMCE editor. This means modules can contain any combination of text, embedded YouTube videos, code blocks, images, or downloadable resources, without the frontend needing specialized components for each media type. The frontend simply renders the HTML.</p>
<p>Quests also carry a <code>learning_materials_html</code> field for targeted explanations tied directly to that quest's tasks — not full lectures, but concise "what you need to solve this" resources.</p>

<h2 id="assessment-types">Assessment Types</h2>
<table class="wiki-table">
  <tr><th>Type</th><th>Who completes it</th><th>Gate behavior</th><th>XP</th><th>Git required</th></tr>
  <tr><td><a href="#quest">Quest</a></td><td>Individual student</td><td>Sequential; must pass to unlock next quest</td><td>Yes, with timed deadline</td><td>Often yes</td></tr>
  <tr><td><a href="#checkpoint">Checkpoint</a></td><td>Individual student</td><td>Hard gate; must pass to advance phase</td><td>Yes on pass</td><td>No (exam format)</td></tr>
  <tr><td><a href="#raid">Raid</a></td><td>Assigned group</td><td>Required for course/subject completion</td><td>Yes, per member on group pass</td><td>Typically yes</td></tr>
</table>

<h2 id="dependencies">Dependencies & Unlocking</h2>
<p>Simple sequential ordering within a parent is handled by the <code>is_sequential</code> flag and the <code>order</code> field. Complex prerequisites — e.g., "you can only access Quest 5 after passing Checkpoint 1, which is in a different course" — are modelled as <strong>CurriculumDependency</strong> rows:</p>

<div class="schema-box">
  <h4>CurriculumDependency</h4>
  <div class="schema-field"><span class="field-name">item_type / item_id</span><span class="field-type">poly</span><span class="field-desc">The entity that is locked (any curriculum type)</span></div>
  <div class="schema-field"><span class="field-name">depends_on_type / depends_on_id</span><span class="field-type">poly</span><span class="field-desc">The entity that must be satisfied first</span></div>
  <div class="schema-field"><span class="field-name">dependency_type</span><span class="field-type">enum</span><span class="field-desc">completion | pass | min_score</span></div>
  <div class="schema-field"><span class="field-name">min_score</span><span class="field-type">integer?</span><span class="field-desc">Required if dependency_type is min_score</span></div>
</div>

<h2 id="progression">Student Progression</h2>
<p>A student's position in the curriculum is tracked on their <code>Enrollment</code> record via <code>current_subject_id</code> and <code>current_course_id</code>. Their daily activity — commits, quest solves, module reads — is aggregated nightly into <code>StudentProgressSnapshot</code> rows, which power the activity map graph and the roadmap tab on the dashboard. The home tab shows the "next module" as an actionable card, alongside upcoming quest deadlines and raid assignments.</p>

<h2 id="activation-pattern">The Activation Pattern</h2>
<p>Each assessment entity — <a href="#quest">Quest</a>, <a href="#raid">Raid</a>, and <a href="#checkpoint">Checkpoint</a> — carries an <code>is_activated</code> boolean. An item is <strong>inert</strong> until activated: its timers do not run, and on the student's frontend it appears as a greyed-out / read-only card so the student can see what's coming without being penalised for not yet being "in" it.</p>
<table class="wiki-table">
  <tr><th>Entity</th><th>Activation trigger</th><th>What activation starts</th></tr>
  <tr><td><a href="#quest">Quest</a></td><td>Student reaches it in their sequential progression (or a cohort-wide scheduled time)</td><td><code>time_limit_minutes</code> and the <code>xp_deadline</code> countdown</td></tr>

  <tr><td><a href="#checkpoint">Checkpoint</a></td><td>Auto-flips <code>activation_lead_minutes</code> (default 10) before <code>scheduled_at</code> for timed exams; or on curriculum-gate arrival for on-demand checkpoints</td><td>The exam becomes enterable; <code>duration_minutes</code> begins on student start</td></tr>
</table>
<p>The <code>is_activated</code> field is local to each entity rather than polymorphic, so it can be extended later to <code>Module</code>/<code>Topic</code>/<code>Course</code> if cohort-wide content drops are needed without a schema overhaul.</p>
`,

  body: `
<h2 id="quest-categories">Quest Categories</h2>
<p>Every quest has a <code>quest_category</code> that determines its submission mechanism, audit pipeline, and XP range:</p>
<table class="wiki-table">
  <tr><th>Category</th><th>Submission</th><th>Audit pipeline</th><th>XP range</th></tr>
  <tr><td><strong>Code Quest</strong></td><td>Gitea repository (code pushed, webhook triggered)</td><td>Automated tests → AI code review → peer audit → instructor review</td><td>50–500 XP depending on difficulty</td></tr>
  <tr><td><strong>Notebook Quest</strong></td><td>Jupyter <code>.ipynb</code> committed to Gitea (<code>submission_type: notebook_gitea</code>)</td><td>Structural validation → AI output review → instructor spot-check (15% random + flagged)</td><td>100–200 XP</td></tr>
  <tr><td><strong>MCQ Quest</strong></td><td>In-platform multiple choice (<code>submission_type: auto_graded</code>)</td><td>Instant automated scoring → behavioral analytics → randomized re-sit if flagged</td><td>25–75 XP</td></tr>
  <tr><td><strong>Essay / Design Quest</strong></td><td>In-platform free response (<code>submission_type: in_platform</code>)</td><td>AI rubric scoring → blind peer review (2 peers) → instructor adjudication → AI content detection</td><td>100–200 XP</td></tr>
</table>
<p>The <code>quest_category</code> field on the Quest entity drives which audit tier pipeline is instantiated when a submission arrives. See the <a href="#audit-system">Audit System</a> page for the full per-category tier descriptions.</p>

<h2 id="quest-structure">Quest Structure</h2>
<p>A Quest entity is attached to a parent — a Module, Topic, or Course — and carries its own evaluation criteria, required programming language, list of allowed packages, and submission instructions. The <code>repository_naming_convention</code> field specifies exactly what the student's Gitea repository and file must be named (e.g., <code>printnmvrbs.go</code>). This naming is enforced at repository creation time by the platform's Gitea integration.</p>

<h2 id="activation">Activation</h2>
<p>A quest is <strong>inert</strong> until <code>is_activated = true</code>. While inert, it appears on the student's frontend as a greyed-out, read-only card — they can see it's coming but cannot enter it, and crucially the <code>time_limit_minutes</code> and <code>xp_deadline</code> countdowns do not run against them. Activation is triggered by the platform when the student reaches this quest in their sequential progression (or, for cohort-wide releases, at a scheduled time). See the <a href="#curriculum">activation pattern</a> for the broader convention used across Quests, Raids, and Checkpoints.</p>

<h2 id="quest-tasks">QuestTasks</h2>
<p>A <strong>QuestTask</strong> is an individual question or sub-challenge within a quest. Tasks have a <code>task_type</code> (code, multiple_choice, short_answer, file_submission, free_response) and carry their own <code>test_cases</code> JSON for auto-graded code tasks. The sum of task <code>points</code> values determines the quest's total possible score. Each task can also carry its own <code>learning_material_html</code> — a targeted explanation for that specific problem, not a general lecture.</p>

<h2 id="xp-timing">XP & Timing Windows</h2>
<p>Quests can have a timed XP mechanic. The <code>xp_deadline</code> field marks a point in time after which completing the quest earns reduced XP (<code>xp_after_deadline</code>) rather than the full <code>xp_reward</code>. This creates urgency and rewards students who engage promptly. After the deadline, retrying still earns the reduced amount — further attempts do not earn zero, but the incentive to complete early is real.</p>

<h2 id="submission-flow">Submission Flow</h2>
<ol>
  <li>Student writes their solution locally and pushes it to their <a href="#gitea">Gitea</a> repository</li>
  <li>The platform's Gitea webhook receiver detects the push and triggers an automated system check</li>
  <li>The system check clones the repo, runs the <code>test_cases</code>, and populates <code>Submission.system_check_result</code></li>
  <li>If system check passes and <code>allows_peer_audit</code> is true, the submission enters <code>awaiting_audit</code> status and is paired with a peer auditor</li>
  <li>If the audit passes, the submission is marked <code>passed</code> and XP is awarded</li>
  <li>If the submission fails (system check or audit), a cooldown is applied and the student must wait <code>cooldown_minutes</code> before retrying</li>
</ol>

<div class="note"><strong>Anti-hardcoding check:</strong> Mentors and peer auditors are instructed to test code with multiple different inputs, not just the sample from the task. The audit checklist explicitly includes a <code>no_hardcoded_answers</code> compliance check to catch students who print a fixed output rather than computing the correct answer.</div>

<h2 id="learning-materials">Learning Materials</h2>
<p>Each Quest carries an optional <code>learning_materials_html</code> field — concise explanatory content to help the student understand and solve the quest. This is not a full lecture; it is targeted material tied directly to the quest's problem domain. Individual QuestTasks can carry their own <code>hint</code> and <code>learning_material_html</code> fields for even more granular support. All content is admin-authored HTML.</p>
`,

<h2 id="role">Role in Curriculum</h2>
<p>Checkpoints sit at course or subject boundaries. Students must pass a checkpoint before gaining access to the next course or subject. The final checkpoint in the program has an extended duration (e.g., 8 hours vs. the standard 4 hours) and no required work follows it. All other checkpoints may be retaken up to <code>max_attempts</code> times. If a student fails and retakes, the system may also require them to re-validate previously passed quests — reinforcing understanding rather than just rote memorization.</p>

<h2 id="scheduling">Scheduling & Activation</h2>
<p>For checkpoints with a fixed time, admins set <code>start_date</code> and <code>start_time</code> (resolved to the cohort/campus timezone in the derived <code>scheduled_at</code>). The student's frontend shows the upcoming checkpoint as a greyed-out, read-only card with the date and time visible — they know exactly when they need to be ready. The exam is <strong>not enterable</strong> until <code>is_activated</code> flips to true, which the platform does automatically <code>activation_lead_minutes</code> (default 10) before <code>scheduled_at</code>. At that point the card becomes interactive, the "Start exam" button enables, and once the student starts, the <code>duration_minutes</code> timer runs against them.</p>
<p>For on-demand (un-scheduled) checkpoints, activation happens when the student reaches the curriculum gate that this checkpoint sits in front of — same <code>is_activated</code> field, different trigger. See the broader <a href="#curriculum">activation pattern</a>.</p>

  <li>At submission, the platform creates an <a href="#audit-system">Audit</a> with a generated Google Meet <code>conference_link</code> (created via the Calendar / Meet API on an organization service account)</li>
  <li>The whole group and the assigned coding mentor join the conference; each member explains the code they authored</li>
  <li>The mentor records per-member outcomes in <code>Audit.code_explanation_results</code>, then opens the audit panel and fills in functional / compliance checks</li>
  <li>If any member is marked <code>could_not_explain</code>, the group fails regardless of code correctness</li>
  <li>On pass, every active <code>GroupMember</code> is awarded <code>xp_reward</code> via an <code>XPTransaction</code></li>
</ol>

<h2 id="group-formation">Group Formation</h2>
<p>When a Raid becomes active, the platform creates <a href="#groups">Group</a> records for the enrolled students using the Raid's <code>distribution_method</code>:</p>
<ul>
  <li><strong>automatic</strong> — the system distributes students into groups within the configured size range</li>
  <li><strong>manual</strong> — a mentor arranges the groups and can add/remove members</li>
  <li><strong>student_formed</strong> — students create and join groups themselves, up to <code>group_size_max</code></li>
</ul>
<p>A student who is marked <code>away</code> in their Record is excluded from automatic distribution — they retain platform access but will not be placed in a group. Mentors can manually add floating students to groups if the distribution leaves someone without a team.</p>

<h2 id="activation">Activation</h2>
<p>A Raid is <strong>inert</strong> until <code>is_activated = true</code>. Activation typically happens once group formation is complete and the shared Gitea repository has been provisioned — there's no point starting the <code>duration_days</code> countdown if the team or the repo isn't ready. From <code>activated_at</code> the deadline is computed as <code>activated_at + duration_days</code> and the team's countdown begins. Before activation, members see the upcoming raid as a greyed-out card on their dashboard. See the <a href="#curriculum">activation pattern</a>.</p>

<h2 id="code-explanation">The Code Explanation Requirement</h2>
<p>When <code>requires_code_explanation = true</code>, the <a href="#audit-system">audit</a> of a Raid submission includes a code explanation component. During the audit conference, each group member must be able to explain the portions of code they authored. If any member cannot explain their code to the auditor's satisfaction, the group fails — even if the code itself runs correctly. This rule is derived directly from real failures observed in the 01Edu system, where groups passed technical checks but had members who contributed nothing and could not explain the submission.</p>

<h2 id="xp-sharing">XP Sharing & Inactive Members</h2>
<p>When a group passes a Raid, every active <code>GroupMember</code> receives the <code>xp_reward</code> automatically. This creates a risk: if an inactive student is left in a group, they receive points without contributing. Mentors are expected to remove consistently absent members from groups using the <code>GroupMember.removed_at</code> mechanism before the Raid completes. This is an intentional design — the platform gives mentors the tools to manage this, rather than trying to automatically detect inactivity. The <em>code explanation</em> step at audit time is the second line of defence: a passenger who can't explain anything fails the whole group.</p>

<h2 id="submission">Submission & Audit Conference</h2>
<p>Groups submit Raid work via a shared <a href="#gitea">Gitea</a> repository. The platform creates one <code>GiteaRepository</code> for the group, adds all members as collaborators via the Gitea API, and stores the mapping in the <code>GiteaRepository.group_id</code> field.</p>
<p>The audit itself is conducted over a video call. When the group submits, the platform creates an <code>Audit</code> record in <code>awaiting_explanation</code> status with an auto-generated Google Meet <code>conference_link</code> (created via the Calendar / Meet API on an organization service account). Both the group members and the assigned coding mentor receive the link. They join, the mentor verifies identities via the <a href="#audit-system">verification code</a> mechanic, and each member walks through the parts of the code they wrote.</p>
<p>The mentor records the per-member outcomes (<code>explained</code> / <code>could_not_explain</code>) in <code>Audit.code_explanation_results</code> during or after the call, sets <code>conference_held_at</code>, and only then proceeds into the standard audit checklist (clone → functional check → compliance checks → bonus questions), evaluating the group collectively. A <code>could_not_explain</code> for any member fails the group regardless of code correctness.</p>
`,
  related: ['curriculum','quest','groups','audit-system','gitea','gamification']
},

  lead: `Rather than building a Git infrastructure from scratch, the platform delegates all version control operations to a self-hosted Gitea instance. Gitea handles user accounts, repositories, access control, tokens, and webhooks natively. The platform maintains thin mapping tables to link its own entities to Gitea's, and uses Gitea's REST API and webhook system to automate the code-submission pipeline.`,
  toc: [

    { id: 'account-provisioning', title: 'Account Provisioning' },
    { id: 'repo-creation', title: 'Repository Creation & Naming' },
    { id: 'webhooks', title: 'Webhooks & Automated Checks' },
    { id: 'audit-flow', title: 'The Audit Clone Flow' },
    { id: 'mapping-entities', title: 'Mapping Entities' },
  ],
  body: `
<h2 id="why-gitea">Why Gitea</h2>
<p>Gitea is a self-hosted, open-source Git service with a full REST API, support for organizations and teams, webhook configuration, and a UI similar to GitHub — making it familiar to students who have used GitHub before. Running it self-hosted means the platform has full control over data, can enforce its own access policies, and avoids rate limits or dependency on third-party SLAs. Gitea's API supports all the operations the platform needs: creating users, creating repositories, adding collaborators, generating access tokens, and configuring webhooks.</p>

<h2 id="account-provisioning">Account Provisioning</h2>
<p>When a student's onboarding is complete and their <code>Enrollment</code> is created, the platform automatically calls Gitea's admin API to create a user account. The Gitea username follows a naming convention (e.g., <code>siwes-{matric_number}</code>) to keep accounts identifiable. The platform stores the mapping in a <strong>GiteaAccount</strong> row, including the hashed API token used for programmatic operations on behalf of the student. When a student is expelled or withdrawn, the platform calls Gitea to deactivate their account.</p>

<h2 id="repo-creation">Repository Creation & Naming</h2>
<p>When a student begins a Quest or a Raid group is formed, the platform creates a repository in Gitea via the API. The repository name must match the <code>repository_naming_convention</code> specified on the Quest or Raid entity (e.g., the platform would enforce that the repo is named exactly <code>ascii-art</code> or that it contains a file named <code>printnmvrbs.go</code>). The clone URL and Gitea-internal repo ID are stored in a <strong>GiteaRepository</strong> row, alongside the quest/raid/group it belongs to.</p>
<p>For Raid submissions, the platform adds all group members as collaborators to the shared repository using Gitea's collaborator API.</p>

<h2 id="webhooks">Webhooks & Automated Checks</h2>
<p>When a student pushes code to their Gitea repository, Gitea fires a push webhook to the platform's webhook receiver endpoint. The platform uses this event to:</p>
<ol>
  <li>Update <code>GiteaRepository.last_push_detected_at</code></li>
  <li>Record a daily activity point in <code>StudentProgressSnapshot.activity_data</code></li>
  <li>Trigger the automated system check: clone the repo, run the configured <code>test_cases</code> from the Quest's QuestTasks, and write the result to <code>Submission.system_check_result</code></li>
  <li>Update <code>Submission.status</code> to reflect the outcome (<code>passed</code>, <code>failed</code>, or <code>awaiting_audit</code>)</li>
</ol>
<p>Webhook configuration is tracked per-repository in the optional <strong>GiteaWebhook</strong> entity (or managed as platform infrastructure config, depending on implementation preference).</p>

<h2 id="audit-flow">The Audit Clone Flow</h2>
<p>When a mentor or peer auditor is assigned to review a submission, they receive the Gitea clone URL from the <code>GiteaRepository</code> record. The auditor runs the clone command in their terminal (<code>git clone {url}</code>), verifies that the clone succeeds (a failed clone is itself a fail condition), and then manually evaluates the code. The audit checklist in <code>Audit.compliance_checks</code> includes a <code>clone_successful</code> field — if cloning fails, the audit stops there and the submission is marked failed.</p>

<h2 id="mapping-entities">Mapping Entities</h2>
<div class="schema-box">
  <h4>GiteaAccount</h4>
  <div class="schema-field"><span class="field-name">user_id</span><span class="field-type">FK</span><span class="field-desc">Platform user this Gitea account belongs to</span></div>
  <div class="schema-field"><span class="field-name">gitea_user_id</span><span class="field-type">integer</span><span class="field-desc">Gitea's internal user ID</span></div>
  <div class="schema-field"><span class="field-name">gitea_username</span><span class="field-type">string</span><span class="field-desc">e.g. siwes-2021001234</span></div>
  <div class="schema-field"><span class="field-name">access_token_hash</span><span class="field-type">string</span><span class="field-desc">Hashed API token for programmatic access</span></div>
  <div class="schema-field"><span class="field-name">is_active</span><span class="field-type">boolean</span><span class="field-desc">Set false on expulsion; platform calls Gitea to deactivate</span></div>
</div>
<div class="schema-box">
  <h4>GiteaRepository</h4>
  <div class="schema-field"><span class="field-name">gitea_repo_id</span><span class="field-type">integer</span><span class="field-desc">Gitea's internal repo ID</span></div>
  <div class="schema-field"><span class="field-name">gitea_repo_name</span><span class="field-type">string</span><span class="field-desc">Enforced at creation to match Quest/Raid naming convention</span></div>
  <div class="schema-field"><span class="field-name">gitea_clone_url</span><span class="field-type">string</span><span class="field-desc">Full URL used by students and auditors to clone</span></div>
  <div class="schema-field"><span class="field-name">quest_id / raid_id / group_id</span><span class="field-type">FK?</span><span class="field-desc">What this repo belongs to (at most one should be set)</span></div>
  <div class="schema-field"><span class="field-name">last_push_detected_at</span><span class="field-type">datetime?</span><span class="field-desc">Updated by webhook on every push</span></div>
</div>
`,

'siwes': {
  title: 'SIWES Documentation',
  subtitle: 'How the platform handles Nigeria\'s Students Industrial Work Experience Scheme requirements',
  breadcrumb: ['home'],
  infobox: {
    title: 'SIWES Layer',
    rows: [
      { label: 'Full name', value: 'Students Industrial Work Experience Scheme' },

  },
  lead: `SIWES is a mandatory scheme for Nigerian engineering students, requiring them to undergo supervised industrial attachment and maintain documented evidence of their work through logbooks and official forms. The platform is built around SIWES compliance — from the campus selection that ties students to physical supervisors, to the document onboarding flow, to the logbook entities that track weekly entries and signatures.`,
  toc: [
    { id: 'what-is-siwes', title: 'What is SIWES' },
    { id: 'logbook', title: 'The Logbook' },
    { id: 'weekly-report', title: 'AI-Assisted Weekly Reports' },
    { id: 'cys-form', title: 'The CYS Form' },
    { id: 'institution-variation', title: 'Institution Variation' },
  ],
  body: `
<h2 id="what-is-siwes">What is SIWES</h2>
<p>The Students Industrial Work Experience Scheme (SIWES) is a skills training programme established by the Industrial Training Fund (ITF) to expose Nigerian university and polytechnic students to industrial work situations related to their courses of study. Most Nigerian engineering programmes require a minimum of 6 months of SIWES before graduation. Students must be placed with an approved company, maintain a logbook of daily/weekly work, and have the logbook signed by their industrial supervisor.</p>
<p>This platform serves as the industrial placement — the company students are attached to — providing structured software engineering training as the SIWES experience. The program's online nature is accommodated by SIWES regulations, but physical documentation (logbook signatures, CYS form stamping) still applies.</p>

<h2 id="logbook">The Logbook</h2>
<p>The SIWES logbook is a physical or digital record of a student's daily and weekly industrial activities. Ideally, entries should be written daily and signed weekly by the industrial supervisor. The platform models this through two entities:</p>
<div class="schema-box">
  <h4>Logbook</h4>
  <div class="schema-field"><span class="field-name">enrollment_id</span><span class="field-type">FK</span><span class="field-desc">The student's active enrollment</span></div>
  <div class="schema-field"><span class="field-name">campus_id</span><span class="field-type">FK</span><span class="field-desc">Determines which supervisor handles physical signing</span></div>
  <div class="schema-field"><span class="field-name">institution_format</span><span class="field-type">text?</span><span class="field-desc">Notes on the student's school's specific logbook format</span></div>
  <div class="schema-field"><span class="field-name">status</span><span class="field-type">enum</span><span class="field-desc">not_started | in_progress | pending_signature | signed | completed</span></div>
</div>
<div class="schema-box">
  <h4>LogbookEntry</h4>
  <div class="schema-field"><span class="field-name">entry_date</span><span class="field-type">date</span><span class="field-desc">The date this entry covers</span></div>
  <div class="schema-field"><span class="field-name">week_number</span><span class="field-type">integer</span><span class="field-desc">Which week of the program</span></div>
  <div class="schema-field"><span class="field-name">content</span><span class="field-type">text</span><span class="field-desc">What the student did/learned that day or week</span></div>
  <div class="schema-field"><span class="field-name">supervisor_signed</span><span class="field-type">boolean</span><span class="field-desc">Whether the campus supervisor has physically signed this entry</span></div>
  <div class="schema-field"><span class="field-name">supervisor_comments</span><span class="field-type">text?</span><span class="field-desc">Optional comments from the supervisor at signing</span></div>
</div>

<h2 id="weekly-report">AI-Assisted Weekly Reports</h2>
<p>SIWES requires not just daily entries but a coherent weekly write-up. To reduce the friction of writing this from scratch, the platform offers an <strong>AI-assisted draft</strong>: at the end of each week, an LLM reads the student's <code>LogbookEntry</code> rows for that week and stitches them into a narrative, stored in <code>WeeklyReport.generated_content</code>. The student then reviews, edits, and submits — the edited version lives in <code>WeeklyReport.final_content</code>.</p>
<p>The student is always the author of record. AI generation is a productivity aid, not a substitute for authentic SIWES documentation: the original <code>LogbookEntry</code> rows remain the source of truth, the AI draft is preserved verbatim alongside the edited version for audit purposes, and the supervisor still signs the report. The <code>generated_by</code> field (<code>system_ai</code> | <code>student</code> | <code>none</code>) records which path was taken; programs that disallow AI assistance can simply leave the feature off.</p>
<div class="schema-box">
  <h4>WeeklyReport — Key Fields</h4>
  <div class="schema-field"><span class="field-name">logbook_id / week_number</span><span class="field-type">FK / int</span><span class="field-desc">Which week of which logbook this covers</span></div>
  <div class="schema-field"><span class="field-name">generated_content</span><span class="field-type">text</span><span class="field-desc">Verbatim AI draft, kept for audit</span></div>
  <div class="schema-field"><span class="field-name">generated_by</span><span class="field-type">enum</span><span class="field-desc">system_ai | student | none</span></div>
  <div class="schema-field"><span class="field-name">final_content</span><span class="field-type">text</span><span class="field-desc">The student-edited version actually submitted</span></div>
  <div class="schema-field"><span class="field-name">status</span><span class="field-type">enum</span><span class="field-desc">draft | edited | submitted | signed</span></div>
  <div class="schema-field"><span class="field-name">supervisor_signed</span><span class="field-type">boolean</span><span class="field-desc">Has the campus supervisor signed off on the final report?</span></div>
</div>

<h2 id="cys-form">The CYS Form</h2>
<p>The Company Year Schedule (CYS) form is the formal agreement document between the student, their institution, and the placement organization. It must be completed and submitted during <a href="#onboarding">onboarding</a>. The platform accepts it as a scanned upload (<code>OnboardingDocument.document_type = 'cys_form'</code>), and the campus office can apply an electronic stamp where regulations allow. Where a physical stamp is required, <code>requires_physical_signature = true</code> and the campus supervisor handles it.</p>

<h2 id="institution-variation">Institution Variation</h2>
<p>A significant practical challenge is that Nigerian universities and polytechnics use different logbook formats — different page layouts, different column structures, different places for signatures, and different schedules for when entries must be made. The <code>Logbook.institution_format</code> text field and <code>OnboardingDocument.metadata</code> JSON field exist to capture these variations. The platform cannot standardize what the institutions have not standardized; instead, it accommodates variation and surfaces it to campus staff who handle the physical elements.</p>
`,
  related: ['campus','onboarding','application-pipeline','verification']
},

  body: `
<h2 id="village-square">The Village Square</h2>
<p>The community section of the student dashboard is conceptualized as a "village square" — a central gathering place where cohort members interact, ask questions, share discoveries, and support each other. The design metaphor evokes a national assembly or town hall, with the home view showing the roadmap prominently alongside community activity. The community tab is always accessible but is secondary to the actionable learning content on the home tab.</p>

<h2 id="groups">Community Groups</h2>
<p>Community groups are created by the system, not by students. This distinguishes them from Discord or WhatsApp where anyone can create groups, which can fragment a cohort's communication into unmonitored channels. Each group has a <code>lifespan_weeks</code> — typically 24 weeks — after which it is dissolved (<code>dissolved_at</code> is set, all members' access to the group chat ends). Students are assigned to groups during cohort setup. This creates a sense of temporary but meaningful belonging, similar to a study group for a semester.</p>

<div class="note"><strong>Note:</strong> Community groups are distinct from <a href="#groups">Raid teams and audit pairs</a>. All three types are modelled under the same <code>Group</code> entity with a <code>type</code> field (<code>community_group</code>, <code>raid_team</code>, <code>audit_pair</code>), but they have different lifecycles and behaviors.</div>

<h2 id="posts">Posts & Threading</h2>
<p>A <strong>Post</strong> is a message in a community group's feed or the program-wide feed (when <code>group_id</code> is null). Posts support threading through the <code>parent_post_id</code> self-reference — replies nest under the original post. Admins and mentors can pin posts (<code>is_pinned = true</code>). Deleted posts are soft-deleted (<code>is_deleted = true</code>) to preserve thread structure. Content is plain text or light HTML.</p>

<h2 id="dms">Direct Messages</h2>
<p>The <strong>DirectMessage</strong> entity enables private one-to-one communication between any two users on the platform — students, mentors, or admins. Messages track <code>read_at</code> for read receipt functionality. Like posts, DMs are soft-deleted. There is no group DM mechanic in the current design; multi-person conversations happen in community groups.</p>

<h2 id="friendships">Friendships</h2>
<p>Students can add each other as friends through a bidirectional <strong>Friendship</strong> entity. The requesting user is recorded in <code>requested_by</code>, and the relationship moves through <code>pending → accepted</code> (or <code>declined</code>). Friends may receive preferential visibility into each other's activity, or the friendship may simply be used as a contact list for DM discovery. The exact UI behavior is a frontend concern; the entity provides the data primitive.</p>

<h2 id="dashboard">Dashboard Placement</h2>
<p>The community features live on a dedicated "Community" tab in the student dashboard. The home tab shows the next actionable module, XP, and rank. The roadmap tab shows curriculum progress. The community tab is the social hub. Within it, students see their assigned community group's chat, the program-wide feed, their DM inbox, and their friend list. The design goal is to make the platform feel like a "talent nation" — a social environment with shared purpose, not just a course viewer.</p>
`,
  related: ['groups','gamification','curriculum','home']
},

  body: `
<h2 id="xp-ledger">XP as an Immutable Ledger</h2>
<p>Rather than storing a single mutable <code>xp_total</code> field on the Enrollment record, every XP event is recorded as an <strong>XPTransaction</strong> row. The current balance is always derived by summing the amounts. This approach provides a complete audit trail (admins can see exactly where every point came from), makes it easy to reverse erroneous awards (add a negative transaction), and avoids race conditions that could corrupt a single balance field under concurrent events.</p>

<div class="schema-box">
  <h4>XPTransaction</h4>

  <div class="schema-field"><span class="field-name">amount</span><span class="field-type">integer</span><span class="field-desc">Positive (earn) or negative (penalty/reversal)</span></div>

  <div class="schema-field"><span class="field-name">source_id</span><span class="field-type">poly FK</span><span class="field-desc">The specific Submission, Audit, Achievement, Streak, or Record that caused this transaction</span></div>
  <div class="schema-field"><span class="field-name">description</span><span class="field-type">text</span><span class="field-desc">Human-readable explanation, shown in XP history</span></div>
  <div class="schema-field"><span class="field-name">awarded_by</span><span class="field-type">user_id?</span><span class="field-desc">Set only for manual_adjustment; identifies the admin</span></div>
</div>

<h2 id="xp-sources">XP Sources</h2>
<table class="wiki-table">

  <tr><td>Module completion</td><td>Student marks module as read</td><td>Module.xp_reward</td></tr>
  <tr><td>Quest pass</td><td>Submission marked passed after audit</td><td>Quest.xp_reward</td></tr>
  <tr><td>Quest bonus</td><td>Bonus criteria met during audit</td><td>Audit.xp_modifier</td></tr>
  <tr><td>Checkpoint pass</td><td>Checkpoint exam scored above passing_score</td><td>Checkpoint configuration</td></tr>
  <tr><td>Raid pass</td><td>Group's submission passes; all active members rewarded</td><td>Raid.xp_reward (per member)</td></tr>
  <tr><td>Achievement unlock</td><td>UserAchievement.unlocked_at set</td><td>Achievement.xp_bonus</td></tr>
  <tr><td>Streak milestone</td><td>Streak.current_streak crosses a configured milestone (e.g., 7, 30, 100 days)</td><td>Configured per milestone</td></tr>
  <tr><td>Manual adjustment</td><td>Admin action</td><td>XPTransaction directly</td></tr>
</table>

<h2 id="timed-xp">Timed XP Windows</h2>
<p>Quests can have an <code>xp_deadline</code>. Completing the quest before the deadline awards the full <code>Quest.xp_reward</code>; completing it after awards the reduced <code>Quest.xp_after_deadline</code>. This creates urgency and rewards active, timely engagement. The same mechanic can express itself differently per cohort by adjusting the deadline configuration without changing the quest itself.</p>

<h2 id="leaderboard">Leaderboard & Rank</h2>
<p>The <strong>Leaderboard</strong> entity defines configurable ranking views. A leaderboard has a <code>scope_type</code> (cohort, program, campus, or course) and a <code>ranking_metric</code> (xp_total, quests_completed, raids_passed, or custom). The student's current rank — e.g., "51 out of 150" — is computed from the leaderboard and stored as a derived field on their Enrollment. Leaderboards can be anonymized (showing only the student's own rank without others' names) or fully public, depending on the program's <code>configuration</code>.</p>

<h2 id="achievements">Achievements</h2>
<p>An <strong>Achievement</strong> is an admin-defined named badge with a rarity tier (<code>common</code>, <code>rare</code>, <code>epic</code>, <code>legendary</code>), an icon, a description, and a criteria definition. Examples: "Quest Hunter" (10 quests passed), "Raid Captain" (5 raids passed as a captain), "First Commit" (your first push to Gitea), "Phoenix" (30-day streak).</p>
<p>For each user, a <strong>UserAchievement</strong> row tracks progress toward the criteria (e.g., <code>{ "current": 6, "target": 10 }</code>) and records the unlock moment. Hidden achievements (<code>is_hidden = true</code>) only appear once unlocked, supporting surprise badges. Unlocking an achievement optionally awards <code>Achievement.xp_bonus</code> via an <code>XPTransaction</code> with <code>source_type = achievement_unlock</code>.</p>
<div class="schema-box">
  <h4>Achievement — Key Fields</h4>
  <div class="schema-field"><span class="field-name">name / icon_url</span><span class="field-type">string</span><span class="field-desc">Display name and badge image</span></div>
  <div class="schema-field"><span class="field-name">rarity</span><span class="field-type">enum</span><span class="field-desc">common | rare | epic | legendary — drives display styling and signals difficulty</span></div>
  <div class="schema-field"><span class="field-name">criteria_type</span><span class="field-type">enum</span><span class="field-desc">quest_count | raid_count | checkpoint_count | streak_days | xp_threshold | module_count | audit_count | composite | manual</span></div>
  <div class="schema-field"><span class="field-name">criteria_config</span><span class="field-type">JSON</span><span class="field-desc">Threshold definition, e.g. { "count": 10 } or { "days": 7 }</span></div>
  <div class="schema-field"><span class="field-name">xp_bonus</span><span class="field-type">integer?</span><span class="field-desc">Optional XP awarded on unlock</span></div>
  <div class="schema-field"><span class="field-name">is_hidden</span><span class="field-type">boolean</span><span class="field-desc">Hidden achievements appear only after unlock</span></div>
</div>

<h2 id="streaks">Streaks</h2>
<p>Each enrollment has a <strong>Streak</strong> row tracking <code>current_streak</code> (days in the current uninterrupted run), <code>longest_streak</code>, and <code>last_activity_date</code>. A "day of activity" is defined by the program's <code>streak_activity_rule</code> configuration (typically: at least one commit, one quest solved, or one module read on a given day in the cohort's timezone).</p>
<p>Crossing a configured milestone (e.g., 7, 30, 100 consecutive days) awards XP via an <code>XPTransaction</code> with <code>source_type = streak_milestone</code> and can also unlock streak-based <a href="#achievements">achievements</a> (e.g., "Phoenix" at 30 days). The <code>last_milestone_awarded</code> field prevents the same milestone being rewarded twice. The dashboard surfaces the current streak prominently to encourage daily return.</p>

<h2 id="dashboard-display">Dashboard Display</h2>
<p>The student home tab prominently displays their XP total, rank, level/title (derived from XP thresholds), and current streak. The roadmap tab shows the <code>StudentProgressSnapshot</code> activity map — a grid of daily activity squares, similar to GitHub's contribution graph — alongside a progress graph through the curriculum stages. A dedicated <em>Achievements</em> view shows earned badges and progress toward unearned ones. The community tab shows the leaderboard in context.</p>
`,
