name: Deploy Admin App to Azure Static Web Apps

on:
  push:
    branches:
      - prod
    paths:
      - 'apps/admin-app/**'
      - '.github/workflows/deploy-admin-app.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN_APP }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "apps/admin-app"
          api_location: ""
          output_location: "dist"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }} # Set this in GitHub Repository Variables
